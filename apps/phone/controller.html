<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>펜싱 코치 · 칼 컨트롤러</title>
    <style>
      :root { --bg: #0b0f19; --fg: #f3f4f6; }
      body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg);
        display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
      body[data-tone='ok'] { background: #052e16; }
      body[data-tone='bad'] { background: #450a0a; }
      #status { font-size: 32px; font-weight: 800; margin: 16px 0; }
      #guide { font-size: 18px; max-width: 28em; line-height: 1.5; }
      #sent { opacity: 0.6; margin-top: 24px; }
      button { font-size: 24px; padding: 16px 32px; border-radius: 12px; border: 0; background: #2563eb; color: #fff; }
      button:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <p id="status">칼 컨트롤러</p>
    <button id="start">센서 켜고 연결</button>
    <p id="guide">손목 스트랩을 걸고 주변 2m를 비운 뒤 누르세요.</p>
    <p id="sent"></p>
    <script type="module" src="/src/controller.ts"></script>
  </body>
</html>
